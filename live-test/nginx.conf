worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WASM needs the correct MIME type for streaming compilation.
    types {
        application/wasm wasm;
    }

    sendfile on;
    keepalive_timeout 65;

    # Allow large uploads/responses to/from the Posda API.
    client_max_body_size 0;

    upstream posda {
        server tcia-posda-rh-1.ad.uams.edu:80;
    }

    # Redirect plain HTTP to HTTPS.
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # The built app expects to live under /mira/ (webpack publicPath).
        location = / {
            return 302 /mira/;
        }

        # Serve the static build out of dist, mounted at /usr/share/nginx/html.
        location /mira/ {
            alias /usr/share/nginx/html/;

            # COOP/COEP are required for SharedArrayBuffer (mirrors the
            # webpack devServer headers).
            add_header Cross-Origin-Opener-Policy   "same-origin"   always;
            add_header Cross-Origin-Embedder-Policy "require-corp"  always;

            # History API fallback so client-side routes resolve to index.html.
            try_files $uri $uri/ /mira/index.html;
        }

        # Proxy the Posda API. The Bearer token matches the webpack devServer
        # config (a non-production proxy token, per TECH_DEBT.md).
        location /papi {
            proxy_pass http://posda;
            proxy_set_header Host       tcia-posda-rh-1.ad.uams.edu;
            proxy_set_header Authorization "Bearer e9a63bc2-bfa5-4299-afb3-c844fb2ef38b";
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_http_version 1.1;

            # Some Posda queries are slow; give the upstream up to 5 minutes.
            proxy_connect_timeout 300s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }

        location /files {
            proxy_pass http://posda;
            proxy_set_header Host       tcia-posda-rh-1.ad.uams.edu;
            proxy_set_header Authorization "Bearer e9a63bc2-bfa5-4299-afb3-c844fb2ef38b";
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_http_version 1.1;
        }
    }
}
